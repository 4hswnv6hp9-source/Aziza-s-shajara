<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qo’ldashevlar shajarasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#f3f8ec; --fg:#1d3322; --muted:#5d7260; --br:#8a5a2b; --canopy:#cfe8b3;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1a12; --fg:#e8f2e6; --muted:#9bb39e; --br:#b98650; --canopy:#1d4a2a;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(ellipse 90% 45% at 50% 0%,var(--canopy),transparent 72%),var(--bg);
  color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
}
header{text-align:center;padding:28px 18px 8px}
h1{font:800 clamp(26px,6vw,40px)/1.1 "Fraunces",Georgia,serif;margin:0 0 8px}
header p{margin:0 auto;max-width:34ch;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;padding:10px 18px 0;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px 2px 6px 2px;vertical-align:-2px;margin-right:5px}

.scroll{overflow-x:auto;padding:34px 12px 0;-webkit-overflow-scrolling:touch}
.inner{display:inline-block;min-width:100%}

/* Daraxt: ildiz pastda, avlodlar tepaga o‘sadi */
.tree ul{display:flex;justify-content:center;align-items:flex-end;margin:0;padding:0 0 22px;position:relative}
.tree>ul{padding-bottom:0}
.tree li{list-style:none;display:flex;flex-direction:column-reverse;align-items:center;position:relative;padding:0 5px 22px}
.tree>ul>li{padding-bottom:0}
.tree li::before,.tree li::after{content:"";position:absolute;bottom:0;right:50%;width:50%;height:22px;border-bottom:2px solid var(--br)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--br)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-bottom:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--br);border-radius:0 0 10px 0}
.tree li:first-child::after{border-radius:0 0 0 10px}
.tree ul ul::before{content:"";position:absolute;bottom:0;left:50%;height:22px;border-left:2px solid var(--br)}

/* Barglar */
.node{
  position:relative;width:112px;padding:8px 6px 9px;text-align:center;color:#fff;
  border-radius:22px 4px 22px 4px;font-size:13px;line-height:1.25;
  box-shadow:0 3px 8px rgba(0,0,0,.2);
  animation:grow .6s both;animation-delay:calc((var(--d) - 1) * .22s);
}
.node small{display:block;font-size:10.5px;opacity:.8}
.node b{display:block;font-size:13px;margin:2px 0}
.node span{font-size:12px;opacity:.92}
.node em{display:block;font-style:normal;font-size:11px;margin-top:5px;padding-top:4px;border-top:1px dashed rgba(255,255,255,.5)}
.g1{background:#6b4423}.g2{background:#2f6b3a}.g3{background:#3a8442}.g4{background:#4f9d4b}
.g5{background:#8cc65f;color:#173012}.g6{background:#c3e17a;color:#2a3a0c}
.g5 em,.g6 em{border-top-color:rgba(0,0,0,.3)}
.f{box-shadow:0 0 0 2px #f4a6c0,0 3px 8px rgba(0,0,0,.2)}
.me{
  width:136px;padding:10px 8px 11px;font-size:14px;
  background:linear-gradient(135deg,#ffe07a,#ffb347);color:#4a2f00;
  box-shadow:0 0 0 3px #fff,0 0 24px 8px rgba(255,196,60,.65);
}
.me b{font-size:15px}
.me::after{content:"🌟";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:22px}
@keyframes grow{from{opacity:0;transform:translateY(14px) scale(.75)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.node{animation:none}}

/* Yer va ildiz */
.ground{
  margin-top:0;height:58px;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(#6b4423,#37230f);color:#ecd9b8;font-weight:600;font-size:13px;
}

footer{padding:26px 18px 40px;display:flex;justify-content:center}
.sig{
  text-align:center;padding:16px 22px;border-radius:26px 6px 26px 6px;
  border:2px solid var(--br);background:color-mix(in srgb,var(--canopy) 55%,transparent);
}
.sig b{display:block;font:800 clamp(17px,4.6vw,22px)/1.25 "Fraunces",Georgia,serif}
.sig span{display:inline-block;margin-top:6px;padding:2px 14px;border-radius:12px 3px 12px 3px;background:#3a8442;color:#fff;font-weight:700;letter-spacing:.04em}
</style>
</head>
<body>

<header>
  <h1>🌳 Qo’ldashevlar shajarasi</h1>
  <p>Pastdan tepaga o‘qing: ildizda — birinchi ajdod, daraxt uchida — Azizabonu.</p>
</header>

<div class="legend">
  <span><i style="background:#6b4423"></i>Ildiz (1-avlod)</span>
  <span><i style="background:#8cc65f;box-shadow:0 0 0 2px #f4a6c0"></i>Qiz / ayol</span>
  <span><i style="background:#ffc247"></i>Azizabonu</span>
  <span>♥ turmush o‘rtog‘i</span>
</div>

<div class="scroll" id="scroll">
  <div class="inner">
    <div class="tree" id="tree"></div>
    <div class="ground">🌱 Ildiz · 1872</div>
  </div>
</div>

<footer>
  <div class="sig">
    <b>Qo’ldasheva Azizabonu Sunnatillo qizi</b>
    <span>ELT-111</span>
  </div>
</footer>

<script>
/* Shajara ma’lumoti. n — ism, y — tug‘ilgan yil, s — turmush o‘rtog‘i [ism, yil],
   f:1 — qiz/ayol, me:1 — Azizabonu, c — farzandlar. O‘zingiznikiga almashtirishingiz mumkin. */
const TREE={n:"Qo’ldosh Eshmat o’g’li",y:1872,s:["Oyxon",1877],c:[
 {n:"Rahmatulla Qo’ldashev",y:1899,s:["Zebiniso",1904],c:[
  {n:"Abdurahim Qo’ldashev",y:1926,s:["Mastura",1931],c:[
   {n:"Sobir Qo’ldashev",y:1953,s:["Gulchehra",1957],c:[
    {n:"Sunnatillo Qo’ldashev",y:1980,s:["Mohichehra",1983],c:[
     {n:"Azizabonu Qo’ldasheva",y:2007,f:1,me:1},
     {n:"Muhammadali Qo’ldashev",y:2010},
     {n:"Sevinch Qo’ldasheva",y:2014,f:1}]},
    {n:"Dildora Qo’ldasheva",y:1982,f:1},
    {n:"Jahongir Qo’ldashev",y:1985}]},
   {n:"Dilorom Qo’ldasheva",y:1956,f:1},
   {n:"Nasiba Qo’ldasheva",y:1960,f:1}]},
  {n:"Hamida Qo’ldasheva",y:1930,f:1}]},
 {n:"Ne’matulla Qo’ldashev",y:1904,s:["Robiya",1908],c:[
  {n:"Xolmurod Qo’ldashev",y:1931,c:[
   {n:"Baxtiyor Qo’ldashev",y:1958}]}]},
 {n:"Hojar Qo’ldasheva",y:1908,f:1}]};

function branch(p,d){
  const kids=(p.c||[]).map(k=>branch(k,d+1)).join("");
  const sp=p.s?`<em>♥ ${p.s[0]} · ${p.s[1]}</em>`:"";
  return `<li><div class="node g${d}${p.f?" f":""}${p.me?" me":""}" style="--d:${d}">`+
    `<small>${d}-avlod</small><b>${p.n}</b><span>${p.y}-yil</span>${sp}</div>`+
    (kids?`<ul>${kids}</ul>`:"")+`</li>`;
}
document.getElementById("tree").innerHTML=`<ul>${branch(TREE,1)}</ul>`;

/* Sahifa ochilganda Azizabonu o‘rtada ko‘rinsin */
const wrap=document.getElementById("scroll"),me=document.querySelector(".me");
if(me){
  const r=me.getBoundingClientRect(),w=wrap.getBoundingClientRect();
  wrap.scrollLeft+=r.left-w.left-(w.width-r.width)/2;
}
</script>
</body>
</html>
